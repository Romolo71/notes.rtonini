<!doctype html>
<html lang="it" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Appunti 5IB Zuccante" />
  <meta name="keywords" content="appunti, 5IB, zuccante, scuola, liceo, informatica, sistemi e reti, sistemi, tpsit" />
  <title>Appunti 5IB Zuccante</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui"],
            mono: ["JetBrains Mono", "ui-monospace"],
          },
          colors: {
            ink: {
              950: "#07080c",
              900: "#0b0d13",
              850: "#0f1218",
              800: "#141821",
              700: "#1c2130",
              600: "#272d3f",
            },
          },
          keyframes: {
            fadeUp: {
              "0%": { opacity: 0, transform: "translateY(10px)" },
              "100%": { opacity: 1, transform: "translateY(0)" },
            },
            pop: {
              "0%": { opacity: 0, transform: "translateY(16px) scale(.98)" },
              "100%": { opacity: 1, transform: "translateY(0) scale(1)" },
            },
            fade: { "0%": { opacity: 0 }, "100%": { opacity: 1 } },
            shimmer: { "100%": { transform: "translateX(100%)" } },
          },
          animation: {
            fadeUp: "fadeUp .45s cubic-bezier(.2,.7,.2,1) both",
            pop: "pop .3s cubic-bezier(.2,.7,.2,1) both",
            fade: "fade .2s ease both",
          },
        },
      },
    };
  </script>
</head>

<body class="font-sans antialiased">
  <div class="relative z-10 flex h-full">
    <!-- Overlay mobile -->
    <div id="scrim" class="fixed inset-0 z-30 bg-black/60 backdrop-blur-sm hidden lg:hidden"></div>

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar"
      class="fixed lg:static z-40 inset-y-0 left-0 w-[300px] -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col bg-ink-900/90 backdrop-blur-xl border-r border-white/[0.06]">
      <div class="px-5 pt-6 pb-4">
        <div class="flex items-center gap-3 mb-5">
          <div
            class="relative h-9 w-9 shrink-0 overflow-hidden rounded-xl grid place-items-center bg-gradient-to-br from-indigo-400 to-violet-600 shadow-lg shadow-indigo-500/20">
            <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 6.25v13m0-13C10.83 5.48 9.25 5 7.5 5S4.17 5.48 3 6.25v13C4.17 18.48 5.75 18 7.5 18s3.33.48 4.5 1.25m0-13C13.17 5.48 14.75 5 16.5 5c1.75 0 3.33.48 4.5 1.25v13C19.83 18.48 18.25 18 16.5 18c-1.75 0-3.33.48-4.5 1.25" />
            </svg>
            <!-- LOGO: metti logo.png accanto a index.html. Se il file non esiste, resta l'icona del libro. -->
            <img src="logo.jpg" alt="" class="absolute inset-0 h-full w-full object-cover" onerror="this.remove()" />
          </div>
          <div>
            <h1 class="text-[15px] font-semibold tracking-tight text-white leading-tight">
              Appunti
            </h1>
            <p class="text-xs text-slate-500">5IB Zuccante 26/27</p>
          </div>
        </div>

        <!-- Ricerca -->
        <div class="relative group">
          <svg
            class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"
            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m21 21-4.3-4.3M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
          </svg>
          <input id="search" type="search" autocomplete="off" placeholder="Cerca per titolo o argomento…"
            class="w-full rounded-xl bg-ink-800 border border-white/[0.06] pl-10 pr-10 py-2.5 text-sm text-slate-100 placeholder:text-slate-500 outline-none transition focus:border-indigo-400/60 focus:ring-4 focus:ring-indigo-500/10 [&::-webkit-search-cancel-button]:hidden" />
          <kbd id="kbd"
            class="absolute right-3 top-1/2 -translate-y-1/2 hidden sm:block text-[10px] font-mono text-slate-500 border border-white/10 rounded px-1.5 py-0.5">/</kbd>
          <button id="clear"
            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 h-6 w-6 rounded-md grid place-items-center text-slate-400 hover:text-white hover:bg-white/10"
            aria-label="Cancella ricerca">
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </div>

      <div class="px-5 pb-2 text-[11px] font-semibold uppercase tracking-widest text-slate-500">
        Corsi
      </div>
      <nav id="nav" class="scroll flex-1 overflow-y-auto px-3 pb-6 space-y-0.5"></nav>

      <div class="px-5 py-4 border-t border-white/[0.06] flex items-center gap-2 text-xs text-slate-500">
        <span id="syncDot" class="h-2 w-2 rounded-full bg-slate-600"></span>
        <span id="syncLabel">Caricamento…</span>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="flex-1 min-w-0 flex flex-col h-full">
      <header
        class="lg:hidden flex items-center gap-3 px-4 py-3 border-b border-white/[0.06] bg-ink-900/70 backdrop-blur-xl">
        <button id="burger" class="h-9 w-9 grid place-items-center rounded-lg hover:bg-white/10" aria-label="Apri menu">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h10" />
          </svg>
        </button>
        <span class="font-semibold tracking-tight">Appunti</span>
      </header>

      <div id="scroller" class="scroll flex-1 overflow-y-auto">
        <div class="mx-auto max-w-6xl px-5 sm:px-8 lg:px-10 py-8 lg:py-12">
          <div id="head" class="mb-8"></div>
          <section id="grid" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3"></section>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div id="backdrop" class="absolute inset-0 bg-ink-950/80 backdrop-blur-md animate-fade"></div>
    <div class="absolute inset-0 overflow-y-auto scroll" id="modalScroll">
      <div class="min-h-full flex items-start sm:items-center justify-center p-0 sm:p-6 lg:p-10">
        <article id="sheet" role="dialog" aria-modal="true"
          class="relative w-full max-w-3xl bg-ink-850 sm:rounded-3xl border border-white/[0.08] shadow-2xl shadow-black/60 animate-pop overflow-clip min-h-screen sm:min-h-0">
          <div id="sheetBar" class="h-1 w-full"></div>
          <button id="close"
            class="absolute right-4 top-5 z-10 h-9 w-9 grid place-items-center rounded-full bg-white/5 hover:bg-white/15 text-slate-300 hover:text-white transition"
            aria-label="Chiudi">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
          <header id="sheetHead" class="px-6 sm:px-10 pt-9 pb-7 border-b border-white/[0.06]"></header>
          <div class="lg:flex">
            <div id="sheetBody" class="nt min-w-0 flex-1 px-6 sm:px-10 py-8 text-[15.5px]"></div>
            <aside id="toc" class="hidden lg:block w-56 shrink-0 pr-8 py-8" style="display: none"></aside>
          </div>
        </article>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
